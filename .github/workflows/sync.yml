name: Fello Account Intelligence Sync

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      record_count:
        description: 'Number of signals to generate'
        required: false
        default: '5'
        type: choice
        options:
          - 5
          - 10
          - 20

  # Webhook trigger (requires GitHub App or external service)
  repository_dispatch:
    types: [trigger-sync]

jobs:
  account-intelligence-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Account Intelligence Sync
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_TOKEN: ${{ secrets.SF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOTAL_RECORDS: ${{ inputs.record_count || '5' }}
        run: python run_sync.py

      - name: Upload logs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
