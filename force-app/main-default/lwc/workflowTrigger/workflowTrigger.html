<template>
    <lightning-card title={title} icon-name="utility:endpoint">
        <div class="slds-p-around_medium">
            <!-- Description -->
            <div class="slds-m-bottom_small">
                <p>{description}</p>
            </div>

            <!-- Error Message -->
            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <h2>
                        <lightning-icon icon-name="utility:error" size="small" class="slds-m-right_x-small"></lightning-icon>
                        {error}
                    </h2>
                </div>
            </template>

            <!-- Success Message -->
            <template if:true={successMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_success" role="alert">
                    <span class="slds-assistive-text">success</span>
                    <h2>
                        <lightning-icon icon-name="utility:success" size="small" class="slds-m-right_x-small"></lightning-icon>
                        {successMessage}
                    </h2>
                </div>
            </template>

            <!-- Trigger Form -->
            <template if:true={isConfiguredValue}>
                <div class="slds-form slds-m-bottom_medium">
                    <!-- Record Count Selection -->
                    <div class="slds-form-element">
                        <label class="slds-form-element__label" for="record-count">Number of Records</label>
                        <div class="slds-form-element__control">
                            <div class="slds-select_container">
                                <select
                                    id="record-count"
                                    class="slds-select"
                                    onchange={handleRecordCountChange}
                                    disabled={loading}
                                >
                                    <template for:each={recordCountOptions} for:item="option">
                                        <option key={option.value} value={option.value}>{option.label}</option>
                                    </template>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Dry Run Checkbox -->
                    <div class="slds-form-element slds-m-top_small">
                        <div class="slds-form-element__control">
                            <lightning-input
                                type="checkbox"
                                label="Dry Run (skip Salesforce sync)"
                                checked={dryRun}
                                onchange={handleDryRunChange}
                                disabled={loading}
                            ></lightning-input>
                        </div>
                    </div>

                    <!-- Trigger Button -->
                    <div class="slds-m-top_medium">
                        <lightning-button
                            variant="brand"
                            label={loading ? 'Running...' : buttonLabel}
                            onclick={handleTrigger}
                            disabled={loading}
                            icon-name={loading ? 'utility:spinner' : 'utility:refresh'}
                            icon-position="left"
                            class="slds-m-left_x-small"
                        ></lightning-button>
                    </div>
                </div>
            </template>

            <!-- Recent Workflows Section -->
            <template if:true={showRecentWorkflows}>
                <div class="slds-m-top_large">
                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                        <h3 class="slds-text-heading_small slds-grow">Recent Workflow Runs</h3>
                        <div class="slds-col_bump-left">
                            <lightning-button-group>
                                <lightning-button
                                    label={showWorkflows ? 'Hide' : 'Show'}
                                    onclick={toggleWorkflows}
                                    variant="border-filled"
                                ></lightning-button>
                                <lightning-button
                                    label="Refresh"
                                    onclick={refreshWorkflows}
                                    icon-name="utility:refresh"
                                    variant="border-filled"
                                ></lightning-button>
                            </lightning-button-group>
                        </div>
                    </div>

                    <template if:true={showWorkflows}>
                        <template if:true={hasWorkflows}>
                            <div class="slds-table slds-table_cell-buffer slds-table_bordered">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th class="" scope="col">
                                            <div class="slds-truncate" title="Status">Status</div>
                                        </th>
                                        <th class="" scope="col">
                                            <div class="slds-truncate" title="Workflow">Workflow</div>
                                        </th>
                                        <th class="" scope="col">
                                            <div class="slds-truncate" title="Created">Created</div>
                                        </th>
                                        <th class="" scope="col">
                                            <div class="slds-truncate" title="Actions">Actions</div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={recentWorkflows} for:item="workflow">
                                        <tr key={workflow.id} class="slds-hint-parent">
                                            <td>
                                                <lightning-icon
                                                    icon-name={statusIcon(workflow.conclusion)}
                                                    size="x-small"
                                                    class={workflow.statusClass}
                                                ></lightning-icon>
                                            </td>
                                            <td>
                                                <div class="slds-truncate" title={workflow.name}>{workflow.name}</div>
                                            </td>
                                            <td>
                                                <div class="slds-truncate" title={workflow.createdDate}>{workflow.createdDate}</div>
                                            </td>
                                            <td>
                                                <a
                                                    href={workflow.html_url}
                                                    target="_blank"
                                                    data-url={workflow.html_url}
                                                    onclick={openWorkflow}
                                                >View</a>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </div>
                        </template>

                        <template if:false={hasWorkflows}>
                            <div class="slds-text-align_center slds-text-color_weak slds-p-vertical_medium">
                                <lightning-icon
                                    icon-name="utility:info"
                                    size="small"
                                    class="slds-m-right_x-small"
                                ></lightning-icon>
                                No recent workflow runs found
                            </div>
                        </template>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
